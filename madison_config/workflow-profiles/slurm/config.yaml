executor: slurm
use-conda: True
jobs: 100                # N jobs submitted at any given time, no point setting higher than ~250
latency-wait: 100        # Wait N seconds for output files due to latency
retries: 4               # Retry jobs N times

# These resources will be applied to all rules, unless overriden on a per-rule basis below.
default-resources:
  mem_mb: attempt * 4000
  mem_mb_reduced: (attempt * 4000) * 0.9  # Mem allocated to java for GATK rules (tries to prevent OOM errors)
  slurm_partition:                        # Leave blank, Della will assign this
  slurm_account: "campbellstaton"         # Sponsor account, set this or snparcher will try to guess
  runtime: 720                            # In minutes (I set at 12 hours)

# =============================================================================
# THREADS 
#   Control number of threads each rule will use.
#   Rules not listed use snpArcher's default (1 core)
# =============================================================================
set-threads:
  fastp: 8                          # my test run saturated 6.4 → 8 for headroom
  bwa_mem: 20                       # 17.8 → 20; don't overrequest or it will reduce N jobs you can run at once
  markdup_library: 4                # sambamba does not get faster past 4 threads
  gatk_haplotypecaller_interval: 2  # 1.2 → 2
  gatk_genomics_db_import: 1        # single-threaded
  gatk_genotype_gvcfs: 1            # single-threaded
  variant_filtration: 1             # single-threaded
  mosdepth: 4                       # 3.1 → 4
  clam_collect: 6                   # 5.1 → 6
  clam_loci: 4                      # 2.7 → 4
  genmap_mappability: 6             # 3.9 → 6

# =============================================================================
# RESOURCES 
#   For rules that need something different than the defaults set above
# =============================================================================
set-resources:
# --- Fastq Processing ---
  fastp: 
    mem_mb: attempt * 4000                  # peak RSS 1.3 GB → 4.0 GB for headroom
    runtime: attempt * 120                  # peak 0.5h → 2h for headroom

# --- Mapping ---
  bwa_mem:
    mem_mb: attempt * 36000                 # mean 36, max 70 → 36 GB; Will increase past 70 on retries
    runtime: attempt * 720                  # 6h → 12h; Highly recommend first attempt <24 hours if possible
  markdup_library:
    mem_mb: attempt * 8000                  # max 4 → 8 for headroom (NOTE: needs 20 GB per billion read pairs)
    runtime: attempt * 120                  # 0.5h → 2h      

# --- Callable Sites ---   
  # genome-driven (cost depends on genome, not sample count)
  # genmap builds an index of the reference; memory ≈ 10× genome size (e.g. 3.6 Gb genome needs 36 GB memory)
  genmap_index:
    mem_mb: attempt * 40000    # 36 GB + some headroom
    runtime: attempt * 120     # 0.5h → 2h
  genmap_mappability:
    mem_mb: attempt * 40000    # 36 GB + some headroom
    runtime: attempt * 120     # 1.25h → 2h
  # cohort-driven (cost grows with sample count)
  # values from the test will be an underestimate and not very helpful. Start with these, then increase if needed.
  clam_loci:
    mem_mb: attempt * 16000    
    runtime: attempt * 1440    
  callable_sites_bed:
    mem_mb: attempt * 16000
    runtime: attempt * 1440          
  coverage_bed:
    mem_mb: attempt * 16000
    runtime: attempt * 1440                  
  mappability_bed: 
    mem_mb: attempt * 16000
    runtime: attempt * 1440                 
  callable_coverage_thresholds:
    mem_mb: attempt * 16000
    runtime: attempt * 1440                  

# --- Variant Calling ---
  # per interval
  gatk_haplotypecaller_interval:
    mem_mb: attempt * 8000                  # 4.0 GB → 8 GB 
    mem_mb_reduced: (attempt * 8000) * 0.9
    runtime: attempt * 480                  # 4h → 8h
  # per cohort -- start here, increase if needed. Will need more resources for larger datasets
  gatk_genomics_db_import:                  
    mem_mb: attempt * 24000   
    mem_mb_reduced: (attempt * 24000) * 0.9
    runtime: attempt * 480                  
  gatk_genotype_gvcfs:
    mem_mb: attempt * 16000                 
    mem_mb_reduced: (attempt * 16000) * 0.9
    runtime: attempt * 480

# --- Hard filtering ---
  variant_filtration:
    mem_mb: attempt * 16000                 # start here, adjust if needed
    runtime: attempt * 480                  # start here, adjust if needed

# =============================================================================
# OTHER RULE NAMES
# They're listed here so that if one ever TIMEOUTs or OOMs you can copy it up into set-resources with real numbers.
# =============================================================================
#   bam_stats                       fast (<2 hours) and light
#   parse_bam_stats                 trivial
#   index_bam_csi                   trivial
#   merge_library_bams    
#   merge_dedup_libraries 
#   concat_interval_gvcfs           trivial
#   concat_interval_vcfs            runs twice, trivial
#   mosdepth                        
#   coverage_bed                    trivial
#   mappability_bed                 trivial
#   callable_coverage_thresholds    trivial
#   clam_collect                    trivial
#   intervals_picard                trivial
#   intervals_db                    trivial
#   intervals_gvcf                  trivial
#   intervals_filter                trivial
#
# If a rule you run isn't in this file at all, it simply uses default-resources.
# =============================================================================